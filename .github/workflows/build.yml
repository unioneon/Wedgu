name: Build and test

on:
  push:
    branches: [windows-style, feature/weather-air-lockscreen]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 · tests and packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make

      - name: Validate all 13 translation catalogs
        shell: pwsh
        run: node scripts/check-locales.js

      - name: Build application
        shell: msys2 {0}
        run: make

      - name: Test locales, settings, rendering and device drivers
        shell: msys2 {0}
        run: make test

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable ZIP
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          ./installer/build-installer.ps1 -Version $version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Wedgu-windows-x64
          path: dist/Wedgu-*/*
          if-no-files-found: error
